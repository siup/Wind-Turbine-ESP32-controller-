# Publishes data/ (the web panel) on GitHub Pages. Web Bluetooth needs HTTPS,
# so this copy is the one to use for BLE control from Chrome on Android.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: data

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
