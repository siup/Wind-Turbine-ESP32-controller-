; Turbina: firmware for a wind turbine model controller (rotor + yaw).
; ESP32 DevKit V1 for testing, ESP32-S3 as the target board.
;
;   pio run -e esp32dev -t upload        firmware
;   pio run -e esp32dev -t uploadfs      web panel (LittleFS image from data/)
;   pio test -e native                   unit tests of the pure logic
;
; Arduino core 3.x comes from the pioarduino platform (the stock PlatformIO
; espressif32 platform still ships core 2.x).

[platformio]
default_envs = esp32dev

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
; WiFi + BLE + web server does not fit the default 1.25 MB app slot on a
; 4 MB ESP32. min_spiffs.csv: 2 x 1.9 MB app (OTA) + 128 kB LittleFS.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/build_web.py
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; network stack on core 0, Arduino loop (control) on core 1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; small per-client WS queue: stale telemetry is worse than dropped telemetry
    -DWS_MAX_QUEUED_MESSAGES=8
    ; BLE peripheral only
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
; warnings for our own sources only (third-party code is not ours to fix)
build_src_flags = -Wall -Wextra

[env:esp32dev]
extends = esp32_base
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Stages 1-2 of the spec: motors, battery, failsafe over Serial only.
; No WiFi/BLE, so the 9V supply can be checked under motor load first.
[env:esp32dev_bench]
extends = esp32_base
board = esp32dev
build_flags =
    ${esp32_base.build_flags}
    -DENABLE_WIFI=0
    -DENABLE_BLE=0

[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++17 -DNATIVE_TEST -Wall -Wextra
